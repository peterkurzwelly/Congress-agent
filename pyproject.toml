[project]
name = "congress-trades"
version = "0.1.0"
description = "Congressional financial disclosure scraper, analyzer, and dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # Validation & Config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # HTTP
    "httpx>=0.27",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # PDF Parsing
    "pdfplumber>=0.11",
    # AI
    "anthropic>=0.40",
    # Market Data
    "yfinance>=0.2",
    # Scheduling
    "apscheduler>=3.10",
    # Alerts
    "python-telegram-bot>=21",
    # HTML Parsing
    "beautifulsoup4>=4.12",
    # Fuzzy Matching
    "thefuzz[speedup]>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/congress_trades"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
