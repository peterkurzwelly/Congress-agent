services:
  # ── Main application ───────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/congress_trades.db
      ENABLE_SCHEDULER: "true"
    volumes:
      - db-data:/app/data
      - pdf-cache:/app/pdfs
    networks:
      - frontend
      - backend
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl-certs:/etc/nginx/ssl:ro
      # Serve frontend static files directly (copied from app image at build time)
      - ../frontend/dist:/app/frontend/dist:ro
      # Let's Encrypt webroot for certificate renewal
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── SQLite backup (run with --profile maintenance) ─────────────────────────
  backup:
    image: keinos/sqlite3:latest
    profiles:
      - maintenance
    environment:
      DB_PATH: /app/data/congress_trades.db
      BACKUP_DIR: /backups
    volumes:
      - db-data:/app/data:ro
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  db-data:
    driver: local
  pdf-cache:
    driver: local
  ssl-certs:
    driver: local
  backups:
    driver: local
  certbot-webroot:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
